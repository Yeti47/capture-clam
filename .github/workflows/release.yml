name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          
      - name: Install GStreamer development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Build Linux AMD64 binary
        run: |
          go build -ldflags="-s -w" -o capture-clam-linux-amd64 ./cmd/capture-clam
          
      - name: Create checksums
        run: |
          sha256sum capture-clam-linux-amd64 > checksums.txt
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            capture-clam-linux-amd64
            capture-clam-linux-arm64
            install-dependencies.sh
            checksums.txt
          generate_release_notes: true
          draft: false
          prinstall-dependencies.sh
            checksums.txt
          body: |
            ## Installation
            
            1. Download `capture-clam-linux-amd64` and `install-dependencies.sh`
            2. Make them executable: `chmod +x capture-clam-linux-amd64 install-dependencies.sh`
            3. Install dependencies: `./install-dependencies.sh`
            4. Run: `./capture-clam-linux-amd64 --help`
            
            **Note:** ARM64 users should build from source using `go build ./cmd/capture-clam`